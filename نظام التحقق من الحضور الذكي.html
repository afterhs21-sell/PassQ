<!DOCTYPE html>
<!-- saved from url=(0039)http://127.0.0.1:5500/scaner/index.html -->
<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التحقق من الحضور الذكي</title>
    <script src="./نظام التحقق من الحضور الذكي_files/html5-qrcode.min.js.download"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.6rem;
        }

        .header p {
            color: #7f8c8d;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        /* حاوية الكاميرا */
        #reader {
            width: 100% !important;
            border: none !important;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #reader video {
            border-radius: 12px;
            object-fit: cover;
        }

        /* نافذة النتيجة التفاعلية */
        .result-box {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            font-size: 1.1rem;
            animation: popIn 0.3s ease;
        }

        .result-success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid var(--success);
        }

        .result-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid var(--danger);
        }

        /* جدول الحاضرين */
        .attendance-list {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background-color: #f7fafc;
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background-color: #c0392b;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>منظّم الدخول الذكي QR</h1>
            <p>امسح كود الكرت للتحقق من الحضور الفوري والفعالية</p>
        </div>

        <div class="card">
            <div id="reader" style="position: relative;"><video muted="true" playsinline="" style="width: 458px; display: block;"></video><canvas id="qr-canvas" width="250" height="250" style="width: 250px; height: 250px; display: none;"></canvas><div id="qr-shaded-region" style="position: absolute; border-width: 104px; border-style: solid; border-color: rgba(0, 0, 0, 0.48); box-sizing: border-box; inset: 0px;"><div style="position: absolute; background-color: rgb(255, 255, 255); width: 40px; height: 5px; top: -5px; left: 0px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 40px; height: 5px; top: -5px; right: 0px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 40px; height: 5px; bottom: -5px; left: 0px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 40px; height: 5px; bottom: -5px; right: 0px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 5px; height: 45px; top: -5px; left: -5px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 5px; height: 45px; bottom: -5px; left: -5px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 5px; height: 45px; top: -5px; right: -5px;"></div><div style="position: absolute; background-color: rgb(255, 255, 255); width: 5px; height: 45px; bottom: -5px; right: -5px;"></div></div><div style="display: none; position: absolute; top: 0px; z-index: 1; background: rgba(9, 9, 9, 0.46); color: rgb(255, 236, 236); text-align: center; width: 100%;">Scanner paused</div></div>
            <div id="scan-result" class="result-box"></div>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; color: var(--primary); display: flex; justify-content: space-between;">
                <span>سجل الحضور اليوم</span>
                <span id="counter" style="color: var(--success);">0 حاضريّن</span>
            </h3>
            
            <div class="attendance-list">
                <table>
                    <thead>
                        <tr>
                            <th>البيانات / الاسم</th>
                            <th>وقت الدخول</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body"></tbody>
                </table>
            </div>

            <div class="btn-group">
                <button class="btn" id="export-btn">تصدير لقائمة Excel</button>
                <button class="btn btn-danger" id="clear-btn">تصفير السجل</button>
            </div>
        </div>
    </div>

    <audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav"></audio>
    <audio id="sound-error" src="https://assets.mixkit.co/active_storage/sfx/911/911-84.wav"></audio>

    <script>
        const scanResultBox = document.getElementById('scan-result');
        const attendanceTableBody = document.getElementById('attendance-table-body');
        const counterLabel = document.getElementById('counter');
        const exportBtn = document.getElementById('export-btn');
        const clearBtn = document.getElementById('clear-btn');

        const soundSuccess = document.getElementById('sound-success');
        const soundError = document.getElementById('sound-error');

        // استرجاع البيانات المخزنة سابقاً أو بدء سجل فارغ
        let scannedCodes = JSON.parse(localStorage.getItem('scannedCodes')) || {};

        // 1. تشغيل الكاميرا والتعرف التلقائي
        const html5QrcodeScanner = new Html5Qrcode("reader");
        
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        };

        // تفعيل الكاميرا الخلفية تلقائياً
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            console.error("تعذر تشغيل الكاميرا: ", err);
            scanResultBox.className = "result-box result-danger";
            scanResultBox.innerText = "يرجى إعطاء الصلاحية للوصول للكاميرا.";
            scanResultBox.style.display = "block";
        });

        // 2. وظيفة التحقق عند نجاح مسح الكود
        let processing = false; // لمنع المسح المتكرر في نفس اللحظة للقطة واحدة
        function onScanSuccess(decodedText, decodedResult) {
            if (processing) return;
            processing = true;

            const cleanText = decodedText.trim();
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // التحقق إذا كان الكود قد مسح من قبل
            if (scannedCodes[cleanText]) {
                // الكود غير فعال! تم مسحه مسبقاً
                soundError.play().catch(() => {}); // تشغيل صوت الخطأ
                
                scanResultBox.className = "result-box result-danger";
                scanResultBox.innerHTML = `⚠️ تنبيه: الكود غير فعال!<br>تم استخدامه مسبقاً في تمام الساعة: ${scannedCodes[cleanText]}`;
                scanResultBox.style.display = "block";
            } else {
                // الكود فعال! يُسجل لأول مرة
                soundSuccess.play().catch(() => {}); // تشغيل صوت النجاح
                
                scannedCodes[cleanText] = timeString;
                localStorage.setItem('scannedCodes', JSON.stringify(scannedCodes));

                scanResultBox.className = "result-box result-success";
                scanResultBox.innerHTML = `✅ تم الحضور بنجاح!<br>الرمز: ${cleanText}`;
                scanResultBox.style.display = "block";

                updateUI();
            }

            // إتاحة الكاميرا للمسح التالي بعد ثانيتين لإعطاء فرصة لقراءة التنبيه
            setTimeout(() => {
                processing = false;
            }, 2500);
        }

        // 3. تحديث واجهة المستخدم وقائمة الحضور
        function updateUI() {
            attendanceTableBody.innerHTML = "";
            const keys = Object.keys(scannedCodes);
            counterLabel.innerText = `${keys.length} حاضريّن`;

            // عرض الحاضرين بحيث يظهر الحاضر الأحدث في الأعلى
            keys.reverse().forEach(code => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 500; color: var(--primary);">${code}</td>
                    <td style="color: #7f8c8d;">${scannedCodes[code]}</td>
                `;
                attendanceTableBody.appendChild(row);
            });
        }

        // 4. تصدير قائمة الحاضرين بصيغة Excel (CSV)
        exportBtn.addEventListener('click', function() {
            const keys = Object.keys(scannedCodes);
            if (keys.length === 0) {
                alert("السجل فارغ حالياً! لا يوجد حضور لتصديره.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // لدعم الحروف العربية في Excel
            csvContent += "الرمز / البيانات,وقت تسجيل الحضور\n";

            keys.forEach(code => {
                csvContent += `"${code}","${scannedCodes[code]}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "سجل_الحضور_اليومي.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 5. تصفير السجل والبدء من جديد
        clearBtn.addEventListener('click', function() {
            if (confirm("هل أنت متأكد من رغبتك في تصفير سجل الحضور؟ هذا الإجراء سيجعل جميع الأكواد التي تم تجميدها فعالة مرة أخرى!")) {
                scannedCodes = {};
                localStorage.removeItem('scannedCodes');
                scanResultBox.style.display = "none";
                updateUI();
            }
        });

        // تشغيل أولي لتحديث اللوحة
        updateUI();
    </script>
